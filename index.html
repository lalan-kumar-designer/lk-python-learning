    <style>
        /* ==========================================================================
           1. CORE ARCHITECTURE & CSS RESET
           ========================================================================== */
        :root {
            --color-primary: #00f3ff;
            --color-primary-glow: rgba(0, 243, 255, 0.6);
            --color-secondary: #ff0055;
            --color-success: #00ff66;
            --color-bg-deep: #020617;
            --font-hud: 'Share Tech Mono', monospace;
            --font-title: 'Orbitron', sans-serif;
            --font-sub: 'Rajdhani', sans-serif;
            --hud-z-index: 100;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--color-bg-deep);
            overflow: hidden;
            font-family: var(--font-sub);
            color: #ffffff;
            /* Mobile-first constraints */
            touch-action: none; 
            -webkit-tap-highlight-color: transparent;
        }

        /* ==========================================================================
           2. 3D WEBGL ENVIRONMENT
           ========================================================================== */
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0; /* GSAP will control this */
        }

        /* ==========================================================================
           3. HUD (HEADS-UP DISPLAY) OVERLAYS - MOBILE FIRST
           ========================================================================== */
        #hud-interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: var(--hud-z-index);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Advanced Screen Vignette */
        .screen-vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 20%, rgba(2, 6, 23, 0.95) 100%);
            z-index: 2;
        }

        /* High-Tech Scanlines Overlay */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 3;
            opacity: 0.5;
            pointer-events: none;
        }

        /* Corners Targeting System */
        .hud-corner {
            position: absolute;
            width: 15vmin;
            height: 15vmin;
            max-width: 100px;
            max-height: 100px;
            border: 2px solid transparent;
            z-index: 10;
            opacity: 0;
            transition: all 0.5s ease;
        }
        .hud-top-left { top: 5%; left: 5%; border-top-color: var(--color-primary); border-left-color: var(--color-primary); }
        .hud-top-right { top: 5%; right: 5%; border-top-color: var(--color-primary); border-right-color: var(--color-primary); }
        .hud-bottom-left { bottom: 5%; left: 5%; border-bottom-color: var(--color-primary); border-left-color: var(--color-primary); }
        .hud-bottom-right { bottom: 5%; right: 5%; border-bottom-color: var(--color-primary); border-right-color: var(--color-primary); }

        /* HUD Telemetry Data */
        .telemetry-data {
            position: absolute;
            font-family: var(--font-hud);
            font-size: 0.65rem;
            color: var(--color-primary);
            text-shadow: 0 0 5px var(--color-primary-glow);
            letter-spacing: 1px;
            z-index: 15;
            line-height: 1.4;
            opacity: 0;
        }
        .data-tl { top: calc(5% + 15px); left: calc(5% + 15px); }
        .data-tr { top: calc(5% + 15px); right: calc(5% + 15px); text-align: right; }
        .data-bl { bottom: calc(5% + 15px); left: calc(5% + 15px); }
        .data-br { bottom: calc(5% + 15px); right: calc(5% + 15px); text-align: right; }

        @media (min-width: 768px) {
            .telemetry-data { font-size: 0.85rem; }
            .hud-top-left { top: 40px; left: 40px; }
            .hud-top-right { top: 40px; right: 40px; }
            .hud-bottom-left { bottom: 40px; left: 40px; }
            .hud-bottom-right { bottom: 40px; right: 40px; }
            .data-tl { top: 55px; left: 55px; }
            .data-tr { top: 55px; right: 55px; }
            .data-bl { bottom: 55px; left: 55px; }
            .data-br { bottom: 55px; right: 55px; }
        }

        /* ==========================================================================
           4. BIOMETRIC CORE (THE MAIN VISUAL)
           ========================================================================== */
        #biometric-core {
            position: relative;
            width: 85vmin; /* Mobile scaling */
            height: 85vmin;
            max-width: 500px;
            max-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            transform: scale(0.5); /* GSAP will animate */
            opacity: 0;
        }

        /* Complex Inline SVG Rings (Heavy Design) */
        .svg-ring-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ring-spin-cw { animation: spin 20s linear infinite; }
        .ring-spin-ccw { animation: spinReverse 15s linear infinite; }
        .ring-pulse { animation: pulseGlow 3s ease-in-out infinite alternate; }

        /* The Image Wrapper */
        #profile-wrapper {
            position: absolute;
            width: 55%;
            height: 55%;
            border-radius: 50%;
            overflow: hidden;
            z-index: 30;
            border: 3px solid rgba(0, 243, 255, 0.8);
            box-shadow: 0 0 30px var(--color-primary-glow), inset 0 0 20px var(--color-primary-glow);
            opacity: 0; /* GSAP will reveal */
            background-color: #000;
        }

        /* THE EXACT IMAGE REQUESTED */
        #engineer-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.15) brightness(1.1) sepia(0.2) hue-rotate(180deg) saturate(1.5);
            transform: scale(1.5); /* For zoom out effect */
            transition: all 1s ease;
        }

        /* Glitch effect applied via JS */
        .img-glitch-active {
            animation: imageGlitch 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
        }

        /* ==========================================================================
           5. IDENTITY & AUTHORIZATION PANEL
           ========================================================================== */
        #identity-panel {
            position: absolute;
            bottom: 15%;
            width: 90%;
            max-width: 600px;
            text-align: center;
            z-index: 25;
            opacity: 0;
        }

        #auth-status-text {
            font-family: var(--font-hud);
            color: var(--color-primary);
            font-size: 0.75rem;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-shadow: 0 0 8px var(--color-primary-glow);
        }

        #main-name {
            font-family: var(--font-title);
            font-size: 8vw; /* Responsive font sizing */

            color: #ffffff;
            letter-spacing: 0.5vw;

            text-shadow: 0 0 15px rgba(0, 243, 255, 0.8), 3px 3px 0px rgba(255, 0, 85, 0.7);
            margin: 5px 0;
            line-height: 1;

        #sub-title {
            font-family: var(--font-sub);
            font-size: 4vw;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 1.5vw;
            text-transform: uppercase;
            margin-top: 5px;
        }

        @media (min-width: 768px) {
            #identity-panel { bottom: 10%; }
            #auth-status-text { font-size: 1rem; letter-spacing: 6px; }
            #main-name { font-size: 3.5rem; letter-spacing: 12px; }
            #sub-title { font-size: 1.5rem; letter-spacing: 8px; }
        }

        /* ==========================================================================
           6. SYSTEM PROGRESS BAR
           ========================================================================== */
        #progress-system {
            margin-top: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-track {
            width: 80%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            border-radius: 1px;
        }

        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: var(--color-primary);
            box-shadow: 0 0 10px var(--color-primary), 0 0 20px var(--color-primary);
        }

        /* ==========================================================================
           7. ADVANCED KEYFRAME ANIMATIONS
           ========================================================================== */
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spinReverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
        
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 5px var(--color-primary)); opacity: 0.7; }
            100% { filter: drop-shadow(0 0 20px var(--color-primary)); opacity: 1; }
        }

        @keyframes imageGlitch {
            0% { transform: translate(0) scale(1.05); filter: hue-rotate(0deg); }
            20% { transform: translate(-4px, 4px) scale(1.05); filter: hue-rotate(90deg); }
            40% { transform: translate(-4px, -4px) scale(1.05); filter: hue-rotate(180deg); }
            60% { transform: translate(4px, 4px) scale(1.05); filter: hue-rotate(270deg); }
            80% { transform: translate(4px, -4px) scale(1.05); filter: hue-rotate(360deg); }
            100% { transform: translate(0) scale(1.05); filter: hue-rotate(0deg); }
        }

        @keyframes nameGlitch {
            0%, 100% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
            10% { clip-path: polygon(0 15%, 100% 15%, 100% 30%, 0 30%); transform: translate(-5px); }
            20% { clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%); transform: translate(5px); }
            30% { clip-path: polygon(0 40%, 100% 40%, 100% 50%, 0 50%); transform: translate(-2px); }
            40% { clip-path: polygon(0 80%, 100% 80%, 100% 90%, 0 90%); transform: translate(2px); }
        }
        .text-glitch { animation: nameGlitch 0.4s cubic-bezier(.25, .46, .45, .94) both 2; }

    top: 0;

            transparent,
            rgba(0,243,255,0.35),

}

#run-code-btn:hover {

            rgba(2,6,23,0.85)

    transform: translateY(-2px);
}

#run-code-btn:hover::before {
    transform: translateX(3px);
}

#run-code-btn:hover::after {
    left: 130%;
}

}

/* Mobile */

    #run-code-btn {
        top: 15px;
        right: 15px;

        padding: 9px 13px;

        font-size: 10px;
        letter-spacing: 1.5px;

        gap: 7px;
    }
}

    <script>
        /**
         * Global Configuration Object
         */
        const AppConfig = {
            targetDestination: 'home.html',
            timings: {
                totalDuration: 11000, // 11 Seconds of cinematic glory
                scanStart: 2000,
                revealStart: 4500,
                redirectStart: 8500
            },
            colors: {
                cyan: 0x00f3ff,
                magenta: 0xff0055,
                dark: 0x020617,
                white: 0xffffff
            }
        };

        /**
         * Class: WebGL 3D Environment Controller
         * Handles Three.js rendering, camera, and massive particle systems.
         */
        class Environment3D {
            constructor() {
                this.canvas = document.getElementById('webgl-canvas');
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(AppConfig.colors.dark, 0.001);
                
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 3000);
                this.camera.position.z = 1000;

                this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: false });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.setClearColor(AppConfig.colors.dark, 1);

                this.clock = new THREE.Clock();
                this.particles = null;
                this.grid = null;

                // Parallax tracking variables
                this.mouseX = 0;
                this.mouseY = 0;
                this.targetX = 0;
                this.targetY = 0;

                this.initObjects();
                this.addEventListeners();
            }

            initObjects() {
                // 1. Massive Holographic Grid (Floor & Ceiling)
                const gridHelperFloor = new THREE.GridHelper(4000, 100, AppConfig.colors.cyan, 0x111111);
                gridHelperFloor.position.y = -400;
                gridHelperFloor.material.transparent = true;
                gridHelperFloor.material.opacity = 0.2;
                this.scene.add(gridHelperFloor);

                const gridHelperCeiling = new THREE.GridHelper(4000, 100, AppConfig.colors.magenta, 0x111111);
                gridHelperCeiling.position.y = 400;
                gridHelperCeiling.material.transparent = true;
                gridHelperCeiling.material.opacity = 0.1;
                this.scene.add(gridHelperCeiling);

                // 2. Complex Particle System (Data Sphere)
                const particleCount = window.innerWidth > 768 ? 4000 : 1500; // Optimize for mobile
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);
                
                const colorCyan = new THREE.Color(AppConfig.colors.cyan);
                const colorWhite = new THREE.Color(AppConfig.colors.white);

                for (let i = 0; i < particleCount; i++) {
                    // Spherical distribution
                    const radius = 600 + (Math.random() * 800);
                    const theta = Math.random() * 2 * Math.PI;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    
                    positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                    positions[i * 3 + 2] = radius * Math.cos(phi);

                    // Mix colors based on position
                    const mixedColor = colorCyan.clone().lerp(colorWhite, Math.random());
                    colors[i * 3] = mixedColor.r;
                    colors[i * 3 + 1] = mixedColor.g;
                    colors[i * 3 + 2] = mixedColor.b;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: window.innerWidth > 768 ? 3 : 2,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.8,
                    blending: THREE.AdditiveBlending,
                    sizeAttenuation: true
                });

                this.particles = new THREE.Points(geometry, material);
                this.scene.add(this.particles);
            }

            addEventListeners() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                // Mouse movement for Desktop Parallax
                document.addEventListener('mousemove', (e) => {
                    this.mouseX = (e.clientX - window.innerWidth / 2) * 2;
                    this.mouseY = (e.clientY - window.innerHeight / 2) * 2;
                });
                
                // Touch movement for Mobile Parallax
                document.addEventListener('touchmove', (e) => {
                    if(e.touches.length > 0) {
                        this.mouseX = (e.touches[0].clientX - window.innerWidth / 2) * 2;
                        this.mouseY = (e.touches[0].clientY - window.innerHeight / 2) * 2;
                    }
                }, { passive: true });
            }

            // Public method to start rendering
            renderLoop = () => {
                requestAnimationFrame(this.renderLoop);
                
                const time = this.clock.getElapsedTime();

                // Smooth Camera Parallax
                this.targetX = this.mouseX * 0.001;
                this.targetY = this.mouseY * 0.001;
                
                this.camera.position.x += (this.mouseX * 0.2 - this.camera.position.x) * 0.05;
                this.camera.position.y += (-this.mouseY * 0.2 - this.camera.position.y) * 0.05;
                this.camera.lookAt(this.scene.position);

                // Animate Particles
                if(this.particles) {
                    this.particles.rotation.y = time * 0.05;
                    this.particles.rotation.z = time * 0.02;
                    
                    // Wave effect on particles
                    const positions = this.particles.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i+1] += Math.sin(time + positions[i]) * 0.5; // slight Y wobble
                    }
                    this.particles.geometry.attributes.position.needsUpdate = true;
                }

                this.renderer.render(this.scene, this.camera);
            }
            
            // Effect method for warp jump
            triggerWarpSpeed() {
                gsap.to(this.camera.position, {
                    z: -2000, // Fly through the particles
                    duration: 1.5,
                    ease: "power4.in"
                });
            }
        }

        /**
         * Class: HUD Interface Controller
         * Handles all 2D screen text, numbers, and data simulations.
         */
        class HUDController {
            constructor() {
                this.els = {
                    hex: document.getElementById('hex-1'),
                    lat: document.getElementById('lat-val'),
                    lng: document.getElementById('lng-val'),
                    alt: document.getElementById('alt-val'),
                    mem: document.getElementById('mem-val'),
                    status: document.getElementById('auth-status-text'),
                    targetStatus: document.getElementById('tel-4').querySelector('span')
                };
                
                this.intervals = [];
            }

            generateHex() {
                return Math.floor(Math.random() * 16777215).toString(16).toUpperCase().padStart(6, '0');
            }

            startTelemetry() {
                // High-speed HUD updates to look highly technical
                const dataLoop = setInterval(() => {
                    this.els.hex.innerText = this.generateHex();
                    
                    // Simulate coordinates shifting slightly
                    const baseLat = 25.0000;
                    const baseLng = 85.0000; // Approx coordinates for Bihar
                    this.els.lat.innerText = (baseLat + (Math.random() * 0.01 - 0.005)).toFixed(4);
                    this.els.lng.innerText = (baseLng + (Math.random() * 0.01 - 0.005)).toFixed(4);
                    this.els.alt.innerText = Math.floor(100 + Math.random() * 50);
                    
                    // Simulate Memory allocation growing
                    let currentMem = parseFloat(this.els.mem.innerText);
                    if(currentMem < 1024) {
                        this.els.mem.innerText = (currentMem + (Math.random() * 10)).toFixed(1);
                    }
                }, 80);
                
                this.intervals.push(dataLoop);
            }

            updateStatus(msg, color = 'var(--color-primary)') {
                this.els.status.innerText = msg;
                this.els.status.style.color = color;
            }

            stopTelemetry() {
                this.intervals.forEach(clearInterval);
            }
        }

        /**
         * Class: Master Sequence Director
         * Utilizes GSAP to choreograph the entire cinematic experience.
         */
        class SequenceDirector {
            constructor(env3d, hud) {
                this.env3d = env3d;
                this.hud = hud;
                this.timeline = gsap.timeline();
            }

            buildAndPlay() {
                const tl = this.timeline;

                // PHASE 1: SYSTEM POWER UP (0s - 2.5s)
                tl.to("#webgl-canvas", { opacity: 1, duration: 2, ease: "power2.inOut" }, 0)
                  .to(".telemetry-data", { opacity: 1, stagger: 0.1, duration: 0.5 }, 0.5)
                  .to(".hud-corner", { opacity: 1, duration: 1 }, 1)
                  .call(() => this.hud.startTelemetry(), null, 1)
                  
                  // Bring in the center core
                  .to("#biometric-core", { opacity: 1, scale: 1, duration: 2, ease: "elastic.out(1, 0.7)" }, 1.5)
                  .to("#identity-panel", { opacity: 1, duration: 1 }, 2);

                // PHASE 2: BIOMETRIC SCANNING (2.5s - 5.5s)
                tl.call(() => this.hud.updateStatus("ANALYZING FACIAL TOPOGRAPHY..."), null, 3)
                  .call(() => {
                      // Apply intense glow during scan
                      document.getElementById('biometric-core').style.filter = "drop-shadow(0 0 20px rgba(0, 243, 255, 0.8))";
                  }, null, 3.5)
                  .call(() => this.hud.updateStatus("COMPARING WITH SECURE DATABASE..."), null, 4.5);

                // PHASE 3: AUTHORIZATION & REVEAL (5.5s - 8.5s)
                tl.call(() => {
                      this.hud.updateStatus("MATCH FOUND: ACCESS GRANTED", "var(--color-success)");
                      this.hud.els.targetStatus.innerText = "LOCKED";
                      this.hud.els.targetStatus.style.color = "var(--color-success)";
                      
                      // Glitch the image wrapper before revealing
                      const wrapper = document.getElementById('profile-wrapper');
                      wrapper.style.opacity = "1";
                      wrapper.classList.add('img-glitch-active');
                  }, null, 5.5)
                  
                  // Stop glitch and reveal clean image
                  .call(() => {
                      document.getElementById('profile-wrapper').classList.remove('img-glitch-active');
                      
                      // Remove color filters to show original image gracefully
                      const img = document.getElementById('engineer-image');
                      img.style.filter = "contrast(1) brightness(1) sepia(0) hue-rotate(0deg) saturate(1)";
                      img.style.transform = "scale(1)"; // Zoom out effect on image
                  }, null, 6)
                  
                  // Glitch and reveal Text (Name & Title)
                  .to("#main-name", { opacity: 1, duration: 0.1 }, 6.2)
                  .call(() => document.getElementById('main-name').classList.add('text-glitch'), null, 6.2)
                  .to("#sub-title", { opacity: 1, y: -10, duration: 1, ease: "power3.out" }, 6.8);

                // PHASE 4: REDIRECTION PROTOCOL (8.5s - 11s)
                tl.call(() => this.hud.updateStatus("ESTABLISHING SECURE CONNECTION TO HOME..."), null, 7.5)
                  .to("#redirect-progress", { width: "100%", duration: 2.5, ease: "power1.inOut" }, 8)
                  
                  // The Warp Out
                  .call(() => {
                      this.hud.updateStatus("EXECUTING HANDOFF...", "var(--color-success)");
                      this.env3d.triggerWarpSpeed(); // 3D Camera zooms forward
                      gsap.to("#hud-interface", { opacity: 0, scale: 1.5, duration: 1, ease: "power3.in" });
                  }, null, 10.5)
                  
                  // Final Redirect Action (Mandatory, no skip)
                  .call(() => {
                      this.hud.stopTelemetry();
                      window.location.href = AppConfig.targetDestination;
                  }, null, 11.5);
            }
        }

        /**
         * Bootstrapper - Initializes the entire architecture when DOM is ready
         */
        window.addEventListener('DOMContentLoaded', () => {
            // Instantiate subsystems
            const engine3D = new Environment3D();
            const hudController = new HUDController();
            const director = new SequenceDirector(engine3D, hudController);

            // Start 3D Rendering Engine
            engine3D.renderLoop();

            // Start Cinematic Sequence (Auto-plays, no user interaction required/allowed)
            director.buildAndPlay();
        });

    </script>
