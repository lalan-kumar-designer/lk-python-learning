<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#060913">
    <meta name="description" content="Python Live Compiler - Smart Device Router">
    <title>Python Live Compiler</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #060913;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.08) 0%, transparent 45%);
            overflow: hidden;
            user-select: none;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        /* Dual-Ring Continuous Spinner */
        .ring-loader {
            position: relative;
            width: 84px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ring-loader::before,
        .ring-loader::after {
            content: '';
            position: absolute;
            border-radius: 50%;
        }

        .ring-loader::before {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(34, 211, 238, 0.12);
            border-top-color: #22d3ee;
            border-right-color: #3b82f6;
            animation: spin 0.9s linear infinite;
        }

        .ring-loader::after {
            width: 74%;
            height: 74%;
            border: 3px solid rgba(250, 204, 21, 0.12);
            border-bottom-color: #facc15;
            animation: spinReverse 1.3s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes spinReverse {
            to { transform: rotate(-360deg); }
        }

        .progress-shimmer {
            background: linear-gradient(90deg, #22d3ee, #3b82f6, #facc15, #22d3ee);
            background-size: 200% 100%;
            animation: shimmer 1.2s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex items-center justify-center p-4 text-slate-100 font-sans">

    <main class="glass-card rounded-3xl p-8 sm:p-10 max-w-md w-full flex flex-col items-center text-center relative overflow-hidden">
        <!-- Ambient Top Glow -->
        <div class="w-32 h-32 bg-cyan-500/15 rounded-full blur-2xl absolute -top-10 pointer-events-none"></div>

        <!-- Continuous Loader with Python Icon -->
        <div class="ring-loader mb-6">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#3776ab] to-[#ffd43b] flex items-center justify-center shadow-lg">
                <i class="fab fa-python text-2xl text-slate-950"></i>
            </div>
        </div>

        <!-- Title -->
        <h1 class="text-2xl font-extrabold tracking-tight text-white mb-1">
            Python Live <span class="text-cyan-400">Compiler</span>
        </h1>

        <!-- Detected Device Badge -->
        <div id="device-badge" class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-white/5 border border-white/10 text-xs font-mono text-cyan-400 my-3">
            <i class="fas fa-microchip animate-pulse" id="device-icon"></i>
            <span id="device-name">Scanning Hardware...</span>
        </div>

        <!-- Status Message -->
        <p id="status" class="text-sm text-slate-400 font-medium mb-5">
            Detecting device environment...
        </p>

        <!-- Smooth Progress Bar -->
        <div class="w-full h-2 bg-slate-800/90 rounded-full overflow-hidden border border-white/5">
            <div id="progress-bar" class="h-full w-1/3 progress-shimmer rounded-full transition-all duration-300"></div>
        </div>
    </main>

    <script>
        /**
         * Automatic Device Router:
         * 1. Mobile View (Normal Smartphone Browser) -> mobrunpy.html
         * 2. Other Devices (Desktop, Laptop, Tablet, Smart TV, OR Mobile with "Desktop Site" ON) -> otherrunpy.html
         */
        function analyzeDeviceEnvironment() {
            const ua = (navigator.userAgent || navigator.vendor || window.opera || "").toLowerCase();
            const platform = (navigator.userAgentData?.platform || navigator.platform || "").toLowerCase();

            // Viewport width (When "Desktop Site" is enabled on a phone, innerWidth becomes ~980px+)
            const viewportWidth = window.innerWidth || document.documentElement.clientWidth;

            // Check if the browser is explicitly reporting a Mobile User-Agent
            // Note: When a mobile user turns ON "Desktop Site", the browser removes "mobile/android/iphone" from UA
            const hasMobileUA = /iphone|ipod|windows phone|iemobile|blackberry|bb10|opera mini|opera mobi|webos|fennec/.test(ua) ||
                                (/android/.test(ua) && /mobile/.test(ua));

            // Check Client Hints if available
            const clientHintMobile = navigator.userAgentData ? navigator.userAgentData.mobile : null;

            // Detect if mobile user turned ON "Desktop Site" mode (wide viewport >= 850px or desktop UA)
            const isDesktopSiteModeOnMobile = viewportWidth >= 850 || (!hasMobileUA && clientHintMobile !== true);

            let isMobile = false;
            let deviceLabel = "Desktop / Other Device";
            let iconClass = "fas fa-desktop";

            if (hasMobileUA && !isDesktopSiteModeOnMobile) {
                // Pure Mobile Mode -> Goes to mobrunpy.html
                isMobile = true;
                deviceLabel = /iphone|ipod/.test(ua) ? "iPhone (Mobile View)" : "Smartphone (Mobile View)";
                iconClass = "fas fa-mobile-screen-button";
            } else {
                // Everything else (Desktop, Laptop, Tablet, TV, or Mobile in "Desktop Site" mode) -> Goes to otherrunpy.html
                isMobile = false;
                if (navigator.maxTouchPoints > 1 && Math.min(window.screen.width, window.screen.height) <= 540) {
                    deviceLabel = "Desktop Site Mode";
                    iconClass = "fas fa-desktop";
                } else if (/ipad|tablet|playbook|silk/.test(ua) || (/android/.test(ua) && !/mobile/.test(ua))) {
                    deviceLabel = "Tablet / Pad";
                    iconClass = "fas fa-tablet-screen-button";
                } else if (/mac/.test(platform)) {
                    deviceLabel = "Mac / Laptop";
                    iconClass = "fas fa-laptop";
                } else if (/win/.test(platform)) {
                    deviceLabel = "Windows PC / Laptop";
                    iconClass = "fas fa-laptop-code";
                } else if (/linux/.test(platform)) {
                    deviceLabel = "Linux / Desktop";
                    iconClass = "fas fa-terminal";
                } else {
                    deviceLabel = "Desktop / Other Device";
                    iconClass = "fas fa-display";
                }
            }

            return {
                isMobile,
                deviceLabel,
                iconClass,
                targetFile: isMobile ? "mobrunpy.html" : "otherrunpy.html"
            };
        }

        function routeToCompiler() {
            const statusEl = document.getElementById("status");
            const badgeNameEl = document.getElementById("device-name");
            const badgeIconEl = document.getElementById("device-icon");
            const progressBar = document.getElementById("progress-bar");

            // Preserve any query parameters or hashes when redirecting
            const queryAndHash = window.location.search + window.location.hash;

            const result = analyzeDeviceEnvironment();
            const destinationUrl = result.targetFile + queryAndHash;

            // Update UI with detected mode
            badgeNameEl.textContent = result.deviceLabel;
            badgeIconEl.className = `${result.iconClass} text-cyan-400`;
            progressBar.style.width = "100%";

            if (result.isMobile) {
                statusEl.textContent = "Redirecting to Mobile Compiler (mobrunpy.html)...";
            } else {
                statusEl.textContent = "Redirecting to Desktop Compiler (otherrunpy.html)...";
            }

            // Fast, smooth redirect
            setTimeout(() => {
                window.location.replace(destinationUrl);
            }, 250);
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", routeToCompiler, { once: true });
        } else {
            routeToCompiler();
        }
    </script>

</body>
</html>
