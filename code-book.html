    <!-- JAVASCRIPT A4 PAGE ENGINE & SYNTAX HIGHLIGHTER -->
    <script>
        (function () {
            const KEYWORDS = new Set([
                "def", "class", "return", "if", "elif", "else", "for", "while",
                "break", "continue", "pass", "import", "from", "as", "try",
                "except", "finally", "raise", "with", "yield", "lambda", "in",
                "not", "and", "or", "is", "None", "True", "False", "global",
                "nonlocal", "del", "assert"
            ]);

            const BUILTINS = new Set([
                "print", "len", "range", "type", "int", "float", "str", "complex",
                "list", "tuple", "set", "dict", "bool", "bytes", "id", "ord", "chr",
                "abs", "round", "min", "max", "sum", "sorted", "reversed", "enumerate",
                "zip", "map", "filter", "open", "super", "isinstance", "any", "all"
            ]);

            function escapeHtml(str) {
                return str
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }

            function buildA4CodeBook() {
                const rawCorpus = document.getElementById("python-corpus").textContent.replace(/^\n+|\n+$/g, "");
                const rawLines = rawCorpus.split("\n");

                // Pre-process lines so each #WAP program has its own 1. 2. 3. line numbers
                const processedLines = [];
                let progLineCounter = 1;
                let inMultilineComment = false;

                for (let i = 0; i < rawLines.length; i++) {
                    const line = rawLines[i];
                    const trimmed = line.trim();

                    if (trimmed === "") {
                        processedLines.push({ ln: "", html: "&nbsp;", unitChange: null });
                        continue;
                    }

                    if (trimmed.startsWith("# ===") || trimmed.startsWith("# UNIT") || trimmed.startsWith("# SBTE")) {
                        let unitTag = null;
                        if (trimmed.includes("UNIT 1.0:")) unitTag = "UNIT 1.0: FUNDAMENTALS OF PYTHON SYNTAX";
                        else if (trimmed.includes("UNIT 2.0:")) unitTag = "UNIT 2.0: CONDITIONAL & ITERATIVE STATEMENTS";
                        else if (trimmed.includes("UNIT 3.0:")) unitTag = "UNIT 3.0: STRING, LIST, TUPLE, SET & DICTIONARY";
                        else if (trimmed.includes("UNIT 4.0:")) unitTag = "UNIT 4.0: FUNCTIONS, MODULES & PACKAGES";
                        else if (trimmed.includes("UNIT 5.0:")) unitTag = "UNIT 5.0: NUMPY ARRAYS & LINEAR ALGEBRA";
                        else if (trimmed.includes("UNIT 6.0:")) unitTag = "UNIT 6.0: EXCEPTION & FILE HANDLING";
                        else if (trimmed.includes("MICRO-PROJECTS")) unitTag = "SBTE LAB MICRO-PROJECTS (1 TO 5)";

                        processedLines.push({
                            ln: "",
                            html: '<span class="tm">' + escapeHtml(line) + '</span>',
                            unitChange: unitTag
                        });
                        continue;
                    }

                    if (trimmed.startsWith("#WAP")) {
                        progLineCounter = 1;
                        inMultilineComment = false;
                        processedLines.push({
                            ln: "",
                            html: '<span class="kw">' + escapeHtml(line) + '</span>',
                            unitChange: null
                        });
                        continue;
                    }

                    const lineLabel = progLineCounter + ".";
                    progLineCounter++;

                    // Check multiline ''' or """ comments
                    if (inMultilineComment) {
                        processedLines.push({
                            ln: lineLabel,
                            html: '<span class="cm">' + escapeHtml(line) + '</span>',
                            unitChange: null
                        });
                        if (trimmed.includes("'''") || trimmed.includes('"""')) {
                            inMultilineComment = false;
                        }
                        continue;
                    }

                    if (trimmed.startsWith("'''") || trimmed.startsWith('"""')) {
                        const delim = trimmed.slice(0, 3);
                        const rest = trimmed.slice(3);
                        if (!rest.includes(delim)) {
                            inMultilineComment = true;
                        }
                        processedLines.push({
                            ln: lineLabel,
                            html: '<span class="cm">' + escapeHtml(line) + '</span>',
                            unitChange: null
                        });
                        continue;
                    }

                    if (trimmed.startsWith("#")) {
                        processedLines.push({
                            ln: lineLabel,
                            html: '<span class="cm">' + escapeHtml(line) + '</span>',
                            unitChange: null
                        });
                        continue;
                    }

                    processedLines.push({
                        ln: lineLabel,
                        html: highlightPythonCode(line),
                        unitChange: null
                    });
                }

                const LINES_PER_PAGE = 52;
                const totalPages = Math.ceil(processedLines.length / LINES_PER_PAGE);
                const bookRoot = document.getElementById("book-root");
                bookRoot.innerHTML = "";

                let currentUnitTag = "UNIT 1.0: FUNDAMENTALS OF PYTHON SYNTAX";

                for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
                    const startLine = pageIdx * LINES_PER_PAGE;
                    const endLine = Math.min(startLine + LINES_PER_PAGE, processedLines.length);
                    const pageSlice = processedLines.slice(startLine, endLine);

                    for (const item of pageSlice) {
                        if (item.unitChange) {
                            currentUnitTag = item.unitChange;
                        }
                    }

                    const pageEl = document.createElement("section");
                    pageEl.className = "a4-page";

                    const headerEl = document.createElement("header");
                    headerEl.className = "page-header";
                    headerEl.innerHTML =
                        '<span class="kw"># SBTE_BIHAR :: 2418305_PYTHON_PROGRAMMING</span>' +
                        '<span class="fn">' + escapeHtml(currentUnitTag) + '</span>';

                    const sheetEl = document.createElement("div");
                    sheetEl.className = "code-sheet";

                    let linesHtml = "";
                    for (let i = 0; i < pageSlice.length; i++) {
                        const row = pageSlice[i];
                        linesHtml +=
                            '<div class="code-line">' +
                            '<span class="ln">' + escapeHtml(row.ln) + '</span>' +
                            '<span class="lc">' + row.html + '</span>' +
                            '</div>';
                    }
                    sheetEl.innerHTML = linesHtml;

                    const footerEl = document.createElement("footer");
                    footerEl.className = "page-footer";
                    footerEl.innerHTML =
                        '<span># POLYTECHNIC HUB // ALL STUDY MATERIAL // CONTACT NOW- 9296783086</span>' +
                        '<span class="tm">BY - LALAN KUMAR' + String(pageIdx + 1).padStart(2, "0") + ' OF ' + String(totalPages).padStart(2, "0") + '</span>';

                    pageEl.appendChild(headerEl);
                    pageEl.appendChild(sheetEl);
                    pageEl.appendChild(footerEl);
                    bookRoot.appendChild(pageEl);
                }

                const counterEl = document.getElementById("page-counter");
                if (counterEl) {
                    counterEl.textContent = "A4 PAGES: " + totalPages + " | LINES: " + processedLines.length;
                }
            }

            function highlightPythonCode(rawLine) {
                const tokenRegex = /(f?"(?:\\.|[^"\\])*"|f?'(?:\\.|[^'\\])*'|r"(?:\\.|[^"\\])*"|r'(?:\\.|[^'\\])*'|#.*$|\b[A-Za-z_][A-Za-z0-9_]*\b|\b\d+(?:\.\d+)?(?:e[+-]?\d+)?j?\b|[+\-*/%=<>!&|^~]+|[()[\]{}.,:;@])/g;
                let lastIndex = 0;
                let output = "";
                let match;
                let prevToken = "";

                while ((match = tokenRegex.exec(rawLine)) !== null) {
                    if (match.index > lastIndex) {
                        output += escapeHtml(rawLine.slice(lastIndex, match.index));
                    }
                    const tok = match[0];

                    if (tok.startsWith("#")) {
                        output += '<span class="cm">' + escapeHtml(tok) + '</span>';
                    } else if (
                        tok.startsWith('"') || tok.startsWith("'") ||
                        tok.startsWith('f"') || tok.startsWith("f'") ||
                        tok.startsWith('r"') || tok.startsWith("r'")
                    ) {
                        output += '<span class="st">' + escapeHtml(tok) + '</span>';
                    } else if (KEYWORDS.has(tok)) {
                        output += '<span class="kw">' + escapeHtml(tok) + '</span>';
                    } else if (BUILTINS.has(tok) || prevToken === "def" || prevToken === "class" || tok.startsWith("__")) {
                        output += '<span class="fn">' + escapeHtml(tok) + '</span>';
                    } else {
                        const afterIdx = match.index + tok.length;
                        const nextChar = rawLine[afterIdx] || "";
                        if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(tok) && nextChar === "(") {
                            output += '<span class="fn">' + escapeHtml(tok) + '</span>';
                        } else {
                            output += '<span class="tx">' + escapeHtml(tok) + '</span>';
                        }
                    }

                    if (tok.trim().length > 0) {
                        prevToken = tok;
                    }
                    lastIndex = tokenRegex.lastIndex;
                }

                if (lastIndex < rawLine.length) {
                    output += escapeHtml(rawLine.slice(lastIndex));
                }

                return output || "&nbsp;";
            }

            window.addEventListener("DOMContentLoaded", buildA4CodeBook);
        })();
    </script>
